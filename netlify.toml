[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.dennis-tw.com/*"
  to = "https://dennis-tw.com/:splat"
  status = 301
  force = true

# NTU NEST deck (separate Netlify site), served at /slides
[[redirects]]
  from = "/slides"
  to = "/slides/s/ntu-nest-startup-week"
  status = 301
  force = true

[[redirects]]
  from = "/slides/"
  to = "/slides/s/ntu-nest-startup-week"
  status = 301
  force = true

[[redirects]]
  from = "/slides/*"
  to = "https://ntu-nest-slides.netlify.app/slides/:splat"
  status = 200
  force = true

# Temporary: every other path shows the cartoon homepage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
