<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#7cc8ff 0%, #bfe6ff 55%, #fff4d6 100%); font-family: "Nunito", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .sun { transform-origin: 1180px 150px; animation: spin 30s linear infinite; }
  .sun-face { animation: bob 3s ease-in-out infinite; }
  .cloud { animation: drift linear infinite; }
  .c1 { animation-duration: 60s; }
  .c2 { animation-duration: 85s; animation-delay: -30s; }
  .c3 { animation-duration: 70s; animation-delay: -50s; }
  .hills-far { animation: slide 40s linear infinite; }
  .hills-near { animation: slide 22s linear infinite; }
  .flowers { animation: slide 22s linear infinite; }
  .hero { animation: hop 0.9s ease-in-out infinite; transform-origin: 700px 610px; }
  .shadow { animation: squash 0.9s ease-in-out infinite; transform-origin: 700px 642px; }
  .leg-l { animation: step 0.45s ease-in-out infinite alternate; transform-origin: 685px 600px; }
  .leg-r { animation: step 0.45s ease-in-out infinite alternate-reverse; transform-origin: 715px 600px; }
  .arm { animation: wave 1.2s ease-in-out infinite; transform-origin: 742px 545px; }
  .eyes { animation: blink 4s infinite; transform-origin: 700px 520px; }
  .bird { animation: fly 14s linear infinite; }
  .wing { animation: flap 0.3s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
  .balloon { animation: float 4s ease-in-out infinite; transform-origin: 790px 420px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { transform: translateY(6px); } }
  @keyframes drift { from { transform: translateX(-420px); } to { transform: translateX(1900px); } }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
  @keyframes squash { 0%,100% { transform: scaleX(1); opacity: .28; } 50% { transform: scaleX(.75); opacity: .16; } }
  @keyframes step { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  @keyframes wave { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-35deg); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes fly { from { transform: translate(1500px, 0); } to { transform: translate(-200px, -60px); } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.6); } }
  @keyframes float { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
